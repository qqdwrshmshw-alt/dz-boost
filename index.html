<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DZ BOOST</title><style>body{background:#080614;color:#fff;font-family:Tahoma;margin:0;padding:30px}main{max-width:700px;margin:auto;background:#17102b;padding:25px;border:1px solid #552c85;border-radius:20px}h1{color:#ffcc28}input,select,button{padding:12px;margin:7px 0;border-radius:9px;border:1px solid #6d35a5;background:#090616;color:white;width:100%;box-sizing:border-box}button{background:linear-gradient(90deg,#6900db,#a42aff);cursor:pointer;font-weight:bold}.hint{color:#bbb;line-height:1.8}</style><main><h1>👑 DZ BOOST</h1><p>لوحة طلبات تجريبية مرتبطة بخادم وقاعدة بيانات.</p><h3>إنشاء حساب / دخول</h3><input id="u" placeholder="اسم المستخدم"><input id="p" type="password" placeholder="كلمة المرور (8 أحرف+)"><button onclick="auth('register')">إنشاء حساب</button><button onclick="auth('login')">دخول</button><h3>طلب ترويج</h3><select id="platform"><option>Instagram</option><option>TikTok</option><option>YouTube</option><option>Facebook</option><option>Telegram</option></select><select id="service"><option>حملة إعلانية / ترويج مشروع</option><option>إدارة محتوى</option><option>تحليل وتقرير نمو</option></select><input id="url" placeholder="رابط صفحتك"><input id="qty" type="number" value="1" min="1"><button onclick="order()">إرسال الطلب</button><button onclick="orders()">عرض طلباتي</button><pre id="out"></pre><p class="hint">هذا starter يحتاج تشغيل على استضافة Node.js. لا ينفذ متابعين وهميين أو دفع حقيقي؛ ربط الدفع ومزود خدمة مشروع يتم بعد إعداد حسابات موثوقة.</p></main><script>async function call(path,body){let r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});let j=await r.json();document.getElementById('out').textContent=JSON.stringify(j,null,2);return j}function auth(a){call(a,{username:u.value,password:p.value})}function order(){call('orders',{platform:platform.value,service:service.value,url:url.value,quantity:+qty.value})}function orders(){call('orders')}</script></html>
